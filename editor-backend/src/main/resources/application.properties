spring.application.name=Collaborative Code Editor Backend
server.port=${PORT:8080}

# --- Database -----------------------------------------------------------------
# Override every value via environment variables in deployment. Never commit real
# credentials: copy application.properties.example, then set these in your shell or
# your platform's secret store.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CollabCode}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Certificate authority bundle for the database connection. Paths are relative to
# the working directory. Required for Aiven; omit for local development.
spring.datasource.hikari.ssl-ca=${DB_SSL_CA:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Redis --------------------------------------------------------------------
# Use rediss:// for TLS endpoints (Upstash and other managed providers).
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# --- Code execution -----------------------------------------------------------
# Which ExecutionStrategy bean to activate. See Phase 1 of REMEDIATION_PLAN.md.
#   firejail     - hardened firejail sandbox (default; works without Docker)
#   containerized - one isolated container per run (requires a Docker-capable host)
collab.execution.type=${EXECUTION_TYPE:firejail}
